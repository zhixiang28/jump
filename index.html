<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Servo Press · 相机测距</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui;background:#111;color:#eee}
  header{display:flex;align-items:center;gap:8px;padding:10px 12px}
  header b{flex:1;font-size:17px}
  button{border:0;border-radius:10px;padding:10px 14px;font-size:16px;background:#2d6cdf;color:#fff}
  button.sec{background:#333}
  button.on{background:#2a9d55}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.4}
  #wrap{position:relative;width:100%;background:#000;touch-action:none;min-height:120px}
  video{width:100%;display:block}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #tip{position:absolute;left:8px;top:8px;right:8px;background:#000a;padding:6px 10px;border-radius:8px;font-size:15px;pointer-events:none}
  .modes{display:flex;gap:8px;padding:10px 12px 0}
  .modes button{flex:1}
  #big{display:flex;align-items:center;justify-content:space-between;padding:12px}
  #ms{font-size:40px;font-weight:700;line-height:1.1}
  #ms small{font-size:15px;color:#aaa;font-weight:400}
  #press{font-size:22px;padding:16px 26px}
  .fb{display:flex;gap:8px;padding:0 12px}
  .fb button{flex:1;padding:14px 6px;font-size:17px}
  #less{background:#b5462f} #more{background:#b5892f} #ok{background:#2a9d55}
  #st{padding:8px 12px 0;color:#7c7;min-height:24px}
  .card{background:#1d1d1d;border-radius:12px;padding:12px;margin:10px 12px}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
  input[type=number]{width:90px;font-size:17px;padding:8px;border-radius:8px;border:0}
  label{font-size:15px}
  summary{font-weight:700}
  small.g{color:#888}
  .ang{display:flex;align-items:center;gap:6px;margin:10px 0}
  .ang span{width:34px;font-size:15px}
  .ang input[type=range]{flex:1;accent-color:#2d6cdf;height:28px}
  .ang input[type=number]{width:62px}
  .pm{padding:8px 12px;font-size:18px}
</style></head><body>

<header>
  <b>Servo Press</b>
  <button id="cam" class="sec">开相机</button>
  <button id="conn">连接蓝牙</button>
</header>

<div id="wrap">
  <video id="v" playsinline muted autoplay></video><canvas id="c"></canvas>
  <div id="tip">先开相机</div>
</div>

<div class="modes">
  <button id="mFrame" class="sec">① 画手机边框</button>
  <button id="mLine" class="sec">② 画距离</button>
</div>

<div id="big">
  <div id="ms">— <small>ms</small><br><small id="dist">&nbsp;</small></div>
  <button id="press">按！</button>
</div>

<div class="fb">
  <button id="less">按太久 −</button>
  <button id="ok">刚好 ✓</button>
  <button id="more">按太短 +</button>
</div>
<div id="st"></div>

<div class="card">
  <div class="row">
    <label><input id="auto" type="checkbox"> 画完自动按</label>
  </div>
  <small class="g" id="info"></small>
</div>

<div class="card">
  <details>
    <summary>进阶设定</summary>
    <div class="row">
      <label>屏幕比例 (高÷宽) <input id="ar" type="number" step="0.01"></label>
    </div>
    <div class="row">
      <label>k <input id="k" type="number" step="0.01"></label>
      <label>b (ms) <input id="b" type="number" step="10"></label>
      <button class="sec" id="resetStep">重置调整幅度</button>
    </div>
    <small class="g">按压时间 = 距离 × k + b。距离单位：手机屏幕宽 = 1000。</small>
    <div class="row">
      <input id="manual" type="number" placeholder="手动 ms">
      <button class="sec" id="go">手动按</button>
    </div>
  </details>
</div>

<div class="card">
  <b>Servo 角度</b>
  <small class="g">（拖动时 servo 会跟着转，调好按保存）</small>
  <div class="ang">
    <span>静止</span>
    <button class="sec pm" data-t="ra" data-d="-1">−</button>
    <input id="raS" type="range" min="0" max="180">
    <button class="sec pm" data-t="ra" data-d="1">＋</button>
    <input id="ra" type="number" min="0" max="180">
  </div>
  <div class="ang">
    <span>压下</span>
    <button class="sec pm" data-t="pa" data-d="-1">−</button>
    <input id="paS" type="range" min="0" max="180">
    <button class="sec pm" data-t="pa" data-d="1">＋</button>
    <input id="pa" type="number" min="0" max="180">
  </div>
  <div class="row">
    <button class="sec" id="toRest">去静止位</button>
    <button class="sec" id="toPush">去压下位</button>
    <button class="sec" id="tryP">试按 300ms</button>
    <button id="saveA">保存</button>
  </div>
  <small class="g" id="angSt">未连接时显示的是上次保存的值</small>
</div>

<script>
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e',
      RX ='6e400002-b5a3-f393-e0a9-e50e24dcca9e',
      TX ='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const $=id=>document.getElementById(id);
const v=$('v'), c=$('c'), ctx=c.getContext('2d');
const store={get(k,d){try{const x=localStorage.getItem('sp_'+k);return x===null?d:JSON.parse(x)}catch{return d}},
             set(k,x){try{localStorage.setItem('sp_'+k,JSON.stringify(x))}catch{}}};
const st=t=>$('st').textContent=t;

// ---------- 状态 ----------
let rx=null;
let mode='frame';
let corners=store.get('corners',[]);   // 归一化画面坐标 [{x,y}] ×4：左上 右上 右下 左下
let H=null;                            // 画面 → 手机屏幕坐标 的透视矩阵
let line=null, drag=null, dragCorner=-1;
let units=0, curMs=0;
let last={ms:0,units:0};               // 上一次「用线」按的
let step=store.get('step',0.10), lastDir=0;

$('k').value=store.get('k',1.0);
$('b').value=store.get('b',0);
$('ar').value=store.get('ar',2.17);
$('auto').checked=store.get('auto',false);
$('k').onchange=()=>{store.set('k',+$('k').value);calc();info()};
$('b').onchange=()=>{store.set('b',+$('b').value);calc();info()};
$('ar').onchange=()=>{store.set('ar',+$('ar').value);buildH();calc()};
$('auto').onchange=()=>store.set('auto',$('auto').checked);

// ---------- 相机 ----------
$('cam').onclick=async()=>{
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});
    v.srcObject=s; await v.play(); $('cam').textContent='相机 ✓';
    setMode(corners.length===4?'line':'frame');
  }catch(e){st('相机打不开：'+e.message+'（要用 HTTPS 网址打开）')}
};
function resize(){const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;draw()}
addEventListener('resize',resize); v.onloadedmetadata=()=>{resize();buildH()};

// ---------- 模式 ----------
function setMode(m){
  mode=m;
  $('mFrame').className=m==='frame'?'on':'sec';
  $('mLine').className=m==='line'?'on':'sec';
  tip(); draw();
}
$('mFrame').onclick=()=>{
  if(mode==='frame'&&corners.length===4){ if(confirmReset())return; }
  setMode('frame');
};
$('mLine').onclick=()=>{ if(corners.length<4){st('先点完手机屏幕 4 个角');return} setMode('line'); };
function confirmReset(){ // 已经在边框模式再按一次 = 清掉重画
  corners=[];H=null;store.set('corners',corners);tip();draw();st('边框已清除，重新点 4 个角');return true;
}
const NAMES=['左上','右上','右下','左下'];
function tip(){
  let t;
  if(!v.srcObject) t='先开相机';
  else if(mode==='frame') t=corners.length<4
      ? `点手机屏幕的【${NAMES[corners.length]}】角 (${corners.length+1}/4)`
      : '边框好了 ✓ 可以拖角微调；再按「①」可清除重画';
  else t='从起点拉到终点';
  $('tip').textContent=t;
}

// ---------- 透视 (4 点 homography) ----------
function solve(A,b){ // 高斯消去
  const n=b.length;
  for(let i=0;i<n;i++){
    let p=i; for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[p][i])) p=r;
    [A[i],A[p]]=[A[p],A[i]]; [b[i],b[p]]=[b[p],b[i]];
    if(Math.abs(A[i][i])<1e-12) return null;
    for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i]; for(let k=i;k<n;k++)A[r][k]-=f*A[i][k]; b[r]-=f*b[i];}
  }
  const x=Array(n).fill(0);
  for(let i=n-1;i>=0;i--){let s=b[i]; for(let k=i+1;k<n;k++)s-=A[i][k]*x[k]; x[i]=s/A[i][i];}
  return x;
}
function vidPx(p){return{x:p.x*(v.videoWidth||16),y:p.y*(v.videoHeight||9)}}
function buildH(){
  if(corners.length!==4){H=null;return}
  const ar=+$('ar').value||2.17;
  const dst=[[0,0],[1000,0],[1000,1000*ar],[0,1000*ar]];
  const A=[],b=[];
  corners.forEach((p,i)=>{
    const {x,y}=vidPx(p), [u,w]=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u);
    A.push([0,0,0,x,y,1,-w*x,-w*y]); b.push(w);
  });
  const h=solve(A,b); H=h?[...h,1]:null;
}
function toScreen(p){ // 归一化画面坐标 → 手机屏幕坐标 (宽 1000)
  const {x,y}=vidPx(p), w=H[6]*x+H[7]*y+H[8];
  return{x:(H[0]*x+H[1]*y+H[2])/w, y:(H[3]*x+H[4]*y+H[5])/w};
}

// ---------- 触控 ----------
function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
function nearCorner(p){
  const r=c.getBoundingClientRect();
  let best=-1,bd=30;
  corners.forEach((q,i)=>{const d=Math.hypot((q.x-p.x)*r.width,(q.y-p.y)*r.height); if(d<bd){bd=d;best=i}});
  return best;
}
c.onpointerdown=e=>{
  if(!v.srcObject)return;
  c.setPointerCapture(e.pointerId);
  const p=pt(e);
  if(mode==='frame'){
    dragCorner=nearCorner(p);
    if(dragCorner<0&&corners.length<4){corners.push(p);dragCorner=corners.length-1;}
    afterCorner();
  }else{
    drag={a:p,b:p}; line=drag; draw();
  }
};
c.onpointermove=e=>{
  const p=pt(e);
  if(mode==='frame'&&dragCorner>=0){corners[dragCorner]=p;afterCorner();}
  else if(drag){drag.b=p;calc();draw();}
};
c.onpointerup=()=>{
  if(mode==='frame'){
    dragCorner=-1; store.set('corners',corners);
    if(corners.length===4&&!line){setTimeout(()=>setMode('line'),400)}
    return;
  }
  if(!drag)return;
  drag=null; calc(); draw();
  if($('auto').checked&&units>5) pressLine();
};
function afterCorner(){buildH();calc();tip();draw();}

// ---------- 计算 ----------
function calc(){
  if(!line||!H){units=0;curMs=0;showMs();return}
  const a=toScreen(line.a), b=toScreen(line.b);
  units=Math.hypot(b.x-a.x,b.y-a.y);
  curMs=Math.max(0,Math.round(units*+$('k').value+ +$('b').value));
  showMs();
}
function showMs(){
  $('ms').innerHTML=units?`${curMs} <small>ms</small><br><small>距离 ${units.toFixed(0)}（屏宽=1000）</small>`
                         :`— <small>ms</small><br><small>&nbsp;</small>`;
}
function info(){$('info').textContent=`k = ${(+$('k').value).toFixed(3)}，b = ${+$('b').value} ms，下次调整幅度 ±${(step*100).toFixed(1)}%`}

// ---------- 画 ----------
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  const W=c.width,Hh=c.height,d=devicePixelRatio;
  if(corners.length){
    ctx.strokeStyle='#33d6ff'; ctx.lineWidth=3*d; ctx.beginPath();
    corners.forEach((p,i)=>i?ctx.lineTo(p.x*W,p.y*Hh):ctx.moveTo(p.x*W,p.y*Hh));
    if(corners.length===4)ctx.closePath(); ctx.stroke();
    ctx.font=`${13*d}px system-ui`;
    corners.forEach((p,i)=>{
      ctx.fillStyle='#33d6ff'; ctx.beginPath(); ctx.arc(p.x*W,p.y*Hh,(mode==='frame'?10:5)*d,0,7); ctx.fill();
      if(mode==='frame'){ctx.fillStyle='#000';ctx.fillText(i+1,p.x*W-4*d,p.y*Hh+4*d)}
    });
  }
  if(line){
    const a={x:line.a.x*W,y:line.a.y*Hh},b={x:line.b.x*W,y:line.b.y*Hh};
    ctx.lineWidth=4*d; ctx.strokeStyle='#ffdd33';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    for(const[p,col]of[[a,'#3c9'],[b,'#f55']]){ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,8*d,0,7);ctx.fill()}
  }
}

// ---------- 快/慢 校准 ----------
// 每次按「太久/太短」：把上一次的按压时间 ±step，反推新的 k。
// 方向跟上次相反 → step 减半（逐步逼近）。
function feedback(dir){
  if(!last.units){st('先用「画距离」按一次，再告诉我快了还是慢了');return}
  if(lastDir&&dir!==lastDir) step=Math.max(0.01,step/2);
  lastDir=dir;
  const b=+$('b').value, newMs=last.ms*(1+dir*step);
  const k=Math.max(0.001,(newMs-b)/last.units);
  $('k').value=k.toFixed(4); store.set('k',k); store.set('step',step);
  st(`${dir<0?'缩短':'加长'} ${(step*100).toFixed(1)}%：刚才那条线下次会按 ${Math.round(newMs)} ms`);
  calc(); info();
}
$('less').onclick=()=>feedback(-1);
$('more').onclick=()=>feedback(+1);
$('ok').onclick=()=>{step=Math.max(0.01,step/2);lastDir=0;store.set('step',step);st('👍 收窄调整幅度');info()};
$('resetStep').onclick=()=>{step=0.10;lastDir=0;store.set('step',step);info();st('调整幅度重置为 ±10%')};

// ---------- 蓝牙 ----------
$('conn').onclick=async()=>{
  if(!navigator.bluetooth){st('这个浏览器不支持 Web Bluetooth（用 Android / 电脑 Chrome；iPhone 用 Bluefy）');return}
  try{
    st('搜索中…');
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
    dev.addEventListener('gattserverdisconnected',()=>{rx=null;$('conn').className='';$('conn').textContent='连接蓝牙';st('蓝牙断开')});
    const s=await (await dev.gatt.connect()).getPrimaryService(SVC);
    rx=await s.getCharacteristic(RX);
    const tx=await s.getCharacteristic(TX);
    await tx.startNotifications();
    tx.addEventListener('characteristicvaluechanged',e=>{
      const m=new TextDecoder().decode(e.target.value);
      if(m[0]==='D')st(`已回弹 ✓（${m.slice(1)} ms）结果怎样？用下面按钮告诉我`);
      if(m[0]==='A'){const[r,p]=m.slice(1).split(',');setAng('ra',+r,false);setAng('pa',+p,false);$('angSt').textContent=`板子上的设定：静止 ${r}°，压下 ${p}°`}
    });
    $('conn').className='on';$('conn').textContent='已连接';st('已连接 '+dev.name);
    send('G');
  }catch(e){st('连接失败：'+e.message)}
};
async function send(cmd){
  if(!rx){st('还没连接蓝牙');return false}
  try{await rx.writeValueWithResponse(new TextEncoder().encode(cmd));return true}
  catch(e){st('发送失败：'+e.message);return false}
}
async function press(ms){
  ms=Math.round(ms); if(!(ms>0)){st('按压时间要大于 0');return false}
  if(await send('P'+ms)){st('按 '+ms+' ms…');return true}
  return false;
}
async function pressLine(){
  if(!units){st('先画一条线');return}
  if(await press(curMs)) last={ms:curMs,units};
}
$('press').onclick=pressLine;
$('go').onclick=()=>press(+$('manual').value);
// ---------- Servo 角度 ----------
// 拖动时连续发 M<角度>；蓝牙一次只能送一个，忙的时候只留最新值
let liveBusy=false, livePending=null;
async function live(a){
  if(!rx)return;
  if(liveBusy){livePending=a;return}
  liveBusy=true;
  try{await rx.writeValueWithResponse(new TextEncoder().encode('M'+a))}catch(e){}
  liveBusy=false;
  if(livePending!==null){const n=livePending;livePending=null;live(n)}
}
function setAng(id,a,move=true){
  a=Math.max(0,Math.min(180,Math.round(a)||0));
  $(id).value=a; $(id+'S').value=a; store.set(id,a);
  if(move) live(a);
}
setAng('ra',store.get('ra',0),false); setAng('pa',store.get('pa',90),false);
['ra','pa'].forEach(id=>{
  $(id+'S').oninput=()=>setAng(id,+$(id+'S').value);
  $(id).onchange=()=>setAng(id,+$(id).value);
});
document.querySelectorAll('.pm').forEach(b=>b.onclick=()=>setAng(b.dataset.t,+$(b.dataset.t).value+ +b.dataset.d));
$('toRest').onclick=()=>live(+$('ra').value);
$('toPush').onclick=()=>live(+$('pa').value);
$('saveA').onclick=async()=>{
  if(await send(`A${+$('ra').value},${+$('pa').value}`)) st('角度已保存到板子 ✓');
};
$('tryP').onclick=async()=>{
  // 先存再试，确保用的是现在的角度
  if(await send(`A${+$('ra').value},${+$('pa').value}`)) setTimeout(()=>press(300),150);
};

info(); tip(); showMs();
</script>
</body></html>
