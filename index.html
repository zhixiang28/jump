<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Servo Press">
<title>Servo Press · 相机测距</title>
<style>
  :root{
    --bg:#0e0f12; --panel:#1a1c21; --panel2:#262a31; --line:#3a3f48;
    --text:#f3f4f6; --sub:#c0c5cd;
    --blue:#3b7cff; --green:#1fa955; --red:#d9472f; --amber:#d58f12;
    --cyan:#33d6ff; --yellow:#ffd83a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%}
  body{padding-bottom:var(--dockH,200px)}

  button{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:12px;padding:10px 14px;min-height:46px;
    background:var(--blue);color:#fff;cursor:pointer;touch-action:manipulation;
    transition:transform .08s,opacity .15s,background-color .15s}
  button:active{transform:scale(.95)}
  button.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  button.on{background:var(--green);color:#fff;border-color:transparent}
  button.dim{background:#2a2d34 !important;color:#9aa0a9 !important;box-shadow:none !important;border:1px solid var(--line)}

  /* ---------- 顶部 ---------- */
  header{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;min-height:56px}
  [hidden]{display:none!important}
  header button{padding:6px 10px;min-height:42px;font-size:15px;flex:none}
  #stepNo{flex:none;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#000;
    display:grid;place-items:center;font-weight:800;font-size:14px}
  #tip{flex:1;min-width:0;font-size:15px;line-height:1.3;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---------- 相机画面 ---------- */
  #stage{display:flex;justify-content:center}
  #wrap{position:relative;background:#000;touch-action:none;overflow:hidden;
    width:100%;height:300px;user-select:none;-webkit-user-select:none}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #wrap.fit video{object-fit:contain}
  #fit{position:absolute;right:8px;bottom:8px;min-height:38px;padding:4px 10px;font-size:14px;
    background:#000b;border:1px solid #fff5;color:#fff}
  #wrap canvas{position:absolute;inset:0;width:100%;height:100%}
  #camBig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:19px;padding:16px 26px}
  #camBig:active{transform:translate(-50%,-50%) scale(.95)}

  .modes{display:flex;gap:6px;padding:6px 10px 0}
  .modes button{flex:1;padding:4px 6px;font-size:15px;min-height:40px}
  .modes #clr{flex:0 0 auto}

  /* ---------- 底部操作区（固定） ---------- */
  #dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#121317;
    border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px #0008}
  #st{font-size:15px;min-height:21px;line-height:1.4;color:var(--sub);margin-bottom:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #st.ok{color:#5fe08f} #st.warn{color:#ffc14d} #st.err{color:#ff7b66}
  .drow{display:flex;align-items:center;gap:12px}
  #ms{flex:1;min-width:0}
  #msN{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  #ms .u{font-size:17px;color:var(--sub);font-weight:600;margin-left:4px}
  #dist{font-size:14px;color:var(--sub);margin-top:4px}
  #press{font-size:24px;font-weight:800;padding:0 28px;min-height:60px;border-radius:16px;
    box-shadow:0 4px 14px #3b7cff55}
  .fb{display:flex;gap:8px;margin-top:8px}
  .fb button{flex:1;padding:6px 4px;font-size:17px;min-height:50px;line-height:1.15}
  #less{background:var(--red)} #more{background:var(--amber)} #ok{background:var(--green)}

  /* ---------- 设定卡片 ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px}
  .card h3{margin:0 0 4px;font-size:17px}
  .row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
  label{font-size:16px;display:flex;align-items:center;gap:8px}
  input[type=number]{width:96px;font-size:17px;padding:9px 10px;border-radius:10px;
    border:1px solid var(--line);background:#0b0c0f;color:var(--text)}
  summary{font-weight:700;font-size:17px;padding:4px 0;cursor:pointer}
  .hint{color:var(--sub);font-size:14px;line-height:1.45}

  .sw{gap:12px;cursor:pointer}
  .sw input{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;border-radius:15px;
    background:#4a4f58;position:relative;transition:background .2s;margin:0}
  .sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;transition:left .2s}
  .sw input:checked{background:var(--green)}
  .sw input:checked::after{left:25px}

  .ang{display:flex;align-items:center;gap:8px;margin:12px 0}
  .ang span{width:38px;font-size:16px;font-weight:600}
  .ang input[type=number]{width:66px;text-align:center}
  .pm{padding:0;width:44px;min-height:44px;font-size:22px}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:60px;height:8px;border-radius:4px;
    background:var(--line);margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
    background:var(--blue);border:3px solid #fff}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--blue);border:3px solid #fff}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .btns button{font-size:15px}

  /* ---------- 预设跳跃 ---------- */
  #pre{margin-top:8px}
  .ph{display:flex;align-items:center;gap:6px}
  #preT{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--text);padding:0;min-height:36px;font-size:15px}
  .ph button.sec,.ph button.on{min-height:36px;padding:4px 10px;font-size:14px}
  #pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;max-height:122px;
    overflow-y:auto;overscroll-behavior:contain}
  #pgrid.edit{max-height:210px}
  .pt{min-height:56px;padding:4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .08s}
  .pt:active{transform:scale(.95)}
  .pt b{font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
  .pt b i{font-style:normal;font-size:13px;color:var(--sub);font-weight:600;margin-left:2px}
  .pt small{font-size:12px;color:var(--sub);font-weight:500}
  .pt.cur{border:2px solid var(--yellow)}
  .pe{display:flex;gap:4px;margin-top:4px;width:100%}
  .pe button{flex:1;min-height:36px;padding:0;font-size:14px;border-radius:8px}
  .pe .del{background:var(--red)}
  .pempty{grid-column:1/-1;color:var(--sub);font-size:14px;padding:6px 2px}
  .pre-line{white-space:pre-line}
  #tplV{width:42px;height:72px;border-radius:6px;background:#000;border:1px solid var(--line);image-rendering:pixelated}

  @media (max-height:520px){
    #msN{font-size:32px} #press{min-height:54px;font-size:20px}
    .fb button{min-height:44px}
  }
</style></head><body>

<header>
  <span id="stepNo">1</span><span id="tip">先开相机，对准手机屏幕</span>
  <button id="inst" class="sec" hidden aria-label="安装到手机">⬇ 安装</button>
  <button id="cam" class="sec" aria-label="相机">📷</button>
  <button id="conn">蓝牙</button>
</header>

<div id="stage">
  <div id="wrap">
    <video id="v" playsinline muted autoplay></video><canvas id="c"></canvas>
    <button id="camBig">📷 开相机</button>
    <button id="fit" hidden>⤡ 全画面</button>
  </div>
</div>

<div class="modes" id="modes">
  <button id="mFrame" class="sec">① 边框</button>
  <button id="mLine" class="sec">② 距离</button>
  <button id="clr" class="sec">↺ 重画边框</button>
</div>

<div class="card">
  <label class="sw"><input id="auto" type="checkbox"> 画完自动按</label>
  <div class="hint" id="info" style="margin-top:8px"></div>
</div>

<div class="card">
  <h3>跳跃方向</h3>
  <label class="sw"><input id="proj" type="checkbox"> 只算沿跳跃方向的距离</label>
  <div class="row">
    <label>右上 <input id="angR" type="number" step="0.5" min="1" max="89" inputmode="decimal">°</label>
    <label>左上 <input id="angL" type="number" step="0.5" min="1" max="89" inputmode="decimal">°</label>
  </div>
  <div class="row"><button class="sec" id="estAng">从最近画线估计</button></div>
  <div class="hint" id="angInfo"></div>
</div>

<div class="card">
  <h3>历史拟合 k / b</h3>
  <div class="hint pre-line" id="fitInfo"></div>
  <div class="row">
    <button id="fitApply">套用拟合结果</button>
    <button class="sec" id="histClr">清除记录</button>
  </div>
</div>

<div class="card">
  <h3>自动找起点</h3>
  <label class="sw"><input id="autoStart" type="checkbox"> 自动找小人当起点</label>
  <div class="row">
    <button class="sec" id="pickT">🎯 点小人取模板</button>
    <canvas id="tplV" width="24" height="41"></canvas>
    <label>信心门槛 <input id="thr" type="number" step="0.05" min="0.3" max="0.95" inputmode="decimal"></label>
  </div>
  <div class="hint" id="asInfo"></div>
</div>

<div class="card">
  <h3>Servo 角度</h3>
  <div class="hint">拖动时 servo 会跟着转，调好按「保存」</div>
  <div class="ang">
    <span>静止</span>
    <button class="sec pm" data-t="ra" data-d="-1">−</button>
    <input id="raS" type="range" min="0" max="180">
    <button class="sec pm" data-t="ra" data-d="1">＋</button>
    <input id="ra" type="number" min="0" max="180">
  </div>
  <div class="ang">
    <span>压下</span>
    <button class="sec pm" data-t="pa" data-d="-1">−</button>
    <input id="paS" type="range" min="0" max="180">
    <button class="sec pm" data-t="pa" data-d="1">＋</button>
    <input id="pa" type="number" min="0" max="180">
  </div>
  <div class="btns">
    <button class="sec" id="toRest">去静止位</button>
    <button class="sec" id="toPush">去压下位</button>
    <button class="sec" id="tryP">试按 300ms</button>
    <button id="saveA">保存到板子</button>
  </div>
  <div class="hint" id="angSt" style="margin-top:10px">未连接时显示的是上次保存的值</div>
</div>

<div class="card">
  <details>
    <summary>进阶设定</summary>
    <div class="row">
      <label>屏幕比例 (高÷宽) <input id="ar" type="number" step="0.01" inputmode="decimal"></label>
    </div>
    <div class="row">
      <label>k <input id="k" type="number" step="0.01" inputmode="decimal"></label>
      <label>b (ms) <input id="b" type="number" step="10" inputmode="numeric"></label>
    </div>
    <div class="row"><button class="sec" id="resetStep">重置调整幅度</button></div>
    <div class="hint">按压时间 = 距离 × k + b。距离单位：手机屏幕宽 = 1000。</div>
    <div class="row">
      <input id="manual" type="number" placeholder="手动 ms" inputmode="numeric">
      <button class="sec" id="go">手动按</button>
    </div>
  </details>
</div>

<div id="dock">
  <div id="st">&nbsp;</div>
  <div class="drow">
    <div id="ms"><span id="msN">--</span><span class="u">ms</span><div id="dist">还没画线</div></div>
    <button id="press">按！</button>
  </div>
  <div id="pre">
    <div class="ph">
      <button id="preT">▾ 预设跳跃</button>
      <button class="sec" id="preAdd">＋ 存现在</button>
      <button class="sec" id="preEdit">编辑</button>
    </div>
    <div id="pgrid"></div>
  </div>
  <div class="fb">
    <button id="less">跳太远 −</button>
    <button id="ok">✓ 刚好</button>
    <button id="more">跳太近 ＋</button>
  </div>
</div>

<script>
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e',
      RX ='6e400002-b5a3-f393-e0a9-e50e24dcca9e',
      TX ='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const $=id=>document.getElementById(id);
const v=$('v'), c=$('c'), ctx=c.getContext('2d'), wrap=$('wrap');
const store={get(k,d){try{const x=localStorage.getItem('sp_'+k);return x===null?d:JSON.parse(x)}catch{return d}},
             set(k,x){try{localStorage.setItem('sp_'+k,JSON.stringify(x))}catch{}}};
function st(t,kind=''){const e=$('st');e.textContent=t||' ';e.className=kind}

// ---------- 状态 ----------
let rx=null;
let mode='frame';
let corners=store.get('corners',[]);   // 归一化画面坐标 [{x,y}] ×4：左上 右上 右下 左下
let H=null;                            // 画面 → 手机屏幕坐标 的透视矩阵
let line=null;                         // {a:{x,y}, b:{x,y}} 归一化画面坐标
let act=null;                          // 正在拖的东西
let units=0, curMs=0;
let rawUnits=0, projDir=null;          // 投影前的距离；投影后的方向/终点（屏幕坐标）
let last={ms:0,units:0};               // 上一次「用线」按的
let step=store.get('step',0.10), lastDir=0;

$('k').value=store.get('k',1.0);
$('b').value=store.get('b',0);
$('ar').value=store.get('ar',2.17);
$('auto').checked=store.get('auto',false);
$('k').onchange=()=>{store.set('k',+$('k').value);calc();info()};
$('b').onchange=()=>{store.set('b',+$('b').value);calc();info()};
$('ar').onchange=()=>{store.set('ar',+$('ar').value);buildH();calc()};
$('auto').onchange=()=>store.set('auto',$('auto').checked);
$('proj').checked=store.get('proj',true);
$('angR').value=store.get('angR',30);
$('angL').value=store.get('angL',30);
$('proj').onchange=()=>{store.set('proj',$('proj').checked);calc();draw();showFit()};
['angR','angL'].forEach(id=>$(id).onchange=()=>{
  const a=Math.min(89,Math.max(1,+$(id).value||30)); $(id).value=a; store.set(id,a); calc(); draw();
});

// ---------- 版面：画面尽量大，但底部按钮永远看得到 ----------
// 点的坐标一律存「归一化影片坐标」(0~1)，画面怎么缩放/裁切都不影响。
let fill=store.get('fill',true), view={s:1,ox:0,oy:0,w:1,h:1};
function fitStage(){
  const dock=$('dock').offsetHeight;
  document.body.style.setProperty('--dockH',(dock+4)+'px');
  const top=$('stage').getBoundingClientRect().top+scrollY;
  const w=document.documentElement.clientWidth;
  const h=Math.round(Math.max(200,innerHeight-dock-top-$('modes').offsetHeight-6));
  wrap.style.height=h+'px';
  wrap.classList.toggle('fit',!fill);
  c.width=Math.round(w*devicePixelRatio); c.height=Math.round(h*devicePixelRatio);
  const vw=v.videoWidth||w, vh=v.videoHeight||h;
  const sc=fill?Math.max(w/vw,h/vh):Math.min(w/vw,h/vh);
  view={s:sc,ox:(w-vw*sc)/2,oy:(h-vh*sc)/2,w,h};
  draw();
}
function toCss(p){return{x:p.x*(v.videoWidth||view.w)*view.s+view.ox, y:p.y*(v.videoHeight||view.h)*view.s+view.oy}}
function fromCss(x,y){return{x:(x-view.ox)/view.s/(v.videoWidth||view.w), y:(y-view.oy)/view.s/(v.videoHeight||view.h)}}
$('fit').onclick=e=>{
  e.stopPropagation(); fill=!fill; store.set('fill',fill);
  $('fit').textContent=fill?'⤡ 全画面':'⤢ 放大'; fitStage();
};
$('fit').textContent=fill?'⤡ 全画面':'⤢ 放大';
addEventListener('resize',fitStage);
addEventListener('orientationchange',()=>setTimeout(fitStage,300));
v.onloadedmetadata=()=>{fitStage();buildH();calc()};

// ---------- 相机 ----------
async function openCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});
    v.srcObject=s; await v.play();
    $('cam').className='on'; $('camBig').style.display='none'; $('fit').hidden=false;
    setMode(corners.length===4?'line':'frame');
    st('相机已开','ok');
  }catch(e){st('相机打不开：'+e.message+'（要用 HTTPS 网址打开）','err')}
}
$('cam').onclick=openCam; $('camBig').onclick=openCam;

// ---------- 模式 ----------
function setMode(m){
  mode=m; if(m!=='line') piece=null;
  $('mFrame').className=m==='frame'?'on':'sec';
  $('mLine').className=m==='line'?'on':'sec';
  tip(); draw();
}
$('mFrame').onclick=()=>setMode('frame');
$('mLine').onclick=()=>{ if(corners.length<4){st('先点完手机屏幕 4 个角','warn');return} setMode('line'); };
$('clr').onclick=()=>{
  corners=[];H=null;store.set('corners',corners);calc();setMode('frame');
  st('边框已清除，重新点 4 个角','warn');
};
const NAMES=['左上','右上','右下','左下'];
function tip(){
  let t,n;
  if(!v.srcObject){t='先开相机，对准手机屏幕';n='1'}
  else if(mode==='frame'){
    n='1';
    t=corners.length<4
      ? `点手机屏幕的【${NAMES[corners.length]}】角（${corners.length+1}/4）`
      : '边框好了 ✓ 可拖动角点微调';
  }else if(mode==='pick'){
    n='🎯'; t='点小人的【脚底中心】取模板';
  }else{
    n='2';
    t=$('autoStart').checked&&tplP
      ? '自动起点：直接点 / 拉到终点（找不到小人就两点画线）'
      : line?'直接再画一条新线就会取代旧的':'从起点（你的位置）拉到终点';
  }
  $('tip').textContent=t; $('stepNo').textContent=n;
}

// ---------- 透视 (4 点 homography) ----------
function solve(A,b){ // 高斯消去
  const n=b.length;
  for(let i=0;i<n;i++){
    let p=i; for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[p][i])) p=r;
    [A[i],A[p]]=[A[p],A[i]]; [b[i],b[p]]=[b[p],b[i]];
    if(Math.abs(A[i][i])<1e-12) return null;
    for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i]; for(let k=i;k<n;k++)A[r][k]-=f*A[i][k]; b[r]-=f*b[i];}
  }
  const x=Array(n).fill(0);
  for(let i=n-1;i>=0;i--){let s=b[i]; for(let k=i+1;k<n;k++)s-=A[i][k]*x[k]; x[i]=s/A[i][i];}
  return x;
}
function vidPx(p){return{x:p.x*(v.videoWidth||16),y:p.y*(v.videoHeight||9)}}
function buildH(){
  if(corners.length!==4){H=null;Hi=null;return}
  const ar=+$('ar').value||2.17;
  const dst=[[0,0],[1000,0],[1000,1000*ar],[0,1000*ar]];
  const A=[],b=[];
  corners.forEach((p,i)=>{
    const {x,y}=vidPx(p), [u,w]=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u);
    A.push([0,0,0,x,y,1,-w*x,-w*y]); b.push(w);
  });
  const h=solve(A,b); H=h?[...h,1]:null;
  Hi=H?inv3(H):null;
}
let Hi=null;                           // 手机屏幕坐标 → 画面 的反矩阵（画投影线用）
function inv3(m){
  const [a,b,c,d,e,f,g,h,i]=m;
  const A=e*i-f*h, B=-(d*i-f*g), C=d*h-e*g, det=a*A+b*B+c*C;
  if(Math.abs(det)<1e-12) return null;
  return [A/det,-(b*i-c*h)/det,(b*f-c*e)/det, B/det,(a*i-c*g)/det,-(a*f-c*d)/det, C/det,-(a*h-b*g)/det,(a*e-b*d)/det];
}
function fromScreen(q){ // 手机屏幕坐标 → 归一化画面坐标
  if(!Hi) return null;
  const x=Hi[0]*q.x+Hi[1]*q.y+Hi[2], y=Hi[3]*q.x+Hi[4]*q.y+Hi[5], w=Hi[6]*q.x+Hi[7]*q.y+Hi[8];
  return {x:x/w/(v.videoWidth||16), y:y/w/(v.videoHeight||9)};
}
function toScreen(p){ // 归一化画面坐标 → 手机屏幕坐标 (宽 1000)
  const {x,y}=vidPx(p), w=H[6]*x+H[7]*y+H[8];
  return{x:(H[0]*x+H[1]*y+H[2])/w, y:(H[3]*x+H[4]*y+H[5])/w};
}

// ---------- 触控 ----------
// 抓住已有的点时保留手指与点的偏移，点不会跳到手指下面；拖动时显示放大镜。
function clamp(p){ // 限制在看得到的画面内
  const a=fromCss(0,0), b=fromCss(view.w,view.h);
  return{x:Math.min(Math.min(1,b.x),Math.max(Math.max(0,a.x),p.x)), y:Math.min(Math.min(1,b.y),Math.max(Math.max(0,a.y),p.y))};
}
function pt(e){const r=c.getBoundingClientRect();return fromCss(e.clientX-r.left,e.clientY-r.top)}
function pxDist(a,b){const A=toCss(a),B=toCss(b);return Math.hypot(A.x-B.x,A.y-B.y)}
function nearest(list,p,maxPx=36){
  let best=-1,bd=maxPx;
  list.forEach((q,i)=>{const d=pxDist(q,p); if(d<bd){bd=d;best=i}});
  return best;
}
c.onpointerdown=e=>{
  if(!v.srcObject||act)return;
  c.setPointerCapture(e.pointerId);
  const p=pt(e);
  if(mode==='pick'){ // 取小人模板
    pickTemplate(clamp(p)); setMode('line'); return;
  }
  if(mode==='frame'){
    let i=nearest(corners,p), fresh=false;
    if(i<0){ if(corners.length>=4)return; corners.push(clamp(p)); i=corners.length-1; fresh=true; }
    const q=corners[i];
    act={kind:'corner',i,off:{x:q.x-p.x,y:q.y-p.y},completes:fresh&&corners.length===4};
    afterCorner();
  }else{
    // 每次碰画面都重新画一条线（旧线不会挡住）
    // 开了「自动找起点」：起点用找到的小人，手指只决定终点；找不到就退回两点画线
    let a=clamp(p);
    if($('autoStart').checked&&tplP&&H){
      const t0=performance.now(), f=findPiece(); piece=f;
      if(f&&f.score>=thr()){a=f.pt;st(`自动起点 ✓（信心 ${f.score.toFixed(2)}），拉到终点`,'ok')}
      else st(f?`找不到小人（信心 ${f.score.toFixed(2)}），请两点画线`:'自动起点失败，请两点画线','warn');
      asInfo(performance.now()-t0);
    }
    act={kind:'end',key:'b',off:{x:0,y:0},prev:line};
    line={a,b:clamp(p)};
    calc();
  }
  loop();
};
c.onpointermove=e=>{
  if(!act)return;
  const p=pt(e), q=clamp({x:p.x+act.off.x,y:p.y+act.off.y});
  if(act.kind==='corner'){corners[act.i]=q;afterCorner();}
  else{line[act.key]=q;calc();}
};
function endDrag(cancel){
  if(!act)return;
  const a=act; act=null;
  if(a.kind==='corner'){
    store.set('corners',corners);
    if(a.completes&&!cancel){st('边框完成 ✓','ok');setTimeout(()=>setMode('line'),350)}
    draw(); return;
  }
  calc();
  if(units<5&&'prev'in a){line=a.prev;calc();}       // 只是点一下，不算画线
  else if(!cancel) rememberVec();
  tip(); draw();
  if(!cancel&&$('auto').checked&&units>5) pressLine();
}
c.onpointerup=()=>endDrag(false);
c.onpointercancel=()=>endDrag(true);
function afterCorner(){buildH();calc();tip();}

// 拖动期间持续重画（放大镜里是实时画面）
let raf=0;
function loop(){ draw(); raf=act?requestAnimationFrame(loop):0; }

// ---------- 计算 ----------
// 游戏只往右上 / 左上跳：把线投影到比较接近的那个方向，只用投影长度。
// 屏幕坐标 y 向下，所以「往上」是 −y。
const projOn=()=>$('proj').checked;
function jumpDirs(){
  const r=+$('angR').value*Math.PI/180, l=+$('angL').value*Math.PI/180;
  return [{x:Math.cos(r),y:-Math.sin(r),name:'右上'},{x:-Math.cos(l),y:-Math.sin(l),name:'左上'}];
}
function calc(){
  projDir=null;
  if(!line||!H){units=0;rawUnits=0;curMs=0;}
  else{
    const a=toScreen(line.a), b=toScreen(line.b), dx=b.x-a.x, dy=b.y-a.y;
    rawUnits=Math.hypot(dx,dy); units=rawUnits;
    if(projOn()&&rawUnits>0){
      let best=null;
      for(const d of jumpDirs()){const dot=dx*d.x+dy*d.y; if(!best||Math.abs(dot)>Math.abs(best.dot))best={d,dot}}
      units=Math.abs(best.dot);
      projDir={name:best.d.name, b:{x:a.x+best.d.x*best.dot, y:a.y+best.d.y*best.dot}};
    }
    curMs=Math.max(0,Math.round(units*+$('k').value+ +$('b').value));
  }
  showMs();
}
function showMs(){
  $('msN').textContent=units?curMs:'--';
  $('dist').textContent=!units?(H?'还没画线':'先画手机边框')
    :projDir?`沿${projDir.name} ${units.toFixed(0)}（原 ${rawUnits.toFixed(0)}，屏宽 = 1000）`
    :`距离 ${units.toFixed(0)}（屏宽 = 1000）`;
  $('press').classList.toggle('dim',!units||!rx);
  const fbOff=!lastTarget||lastTarget.type==='manual';
  ['less','ok','more'].forEach(id=>$(id).classList.toggle('dim',fbOff));
}
function info(){$('info').textContent=`k = ${(+$('k').value).toFixed(3)}，b = ${+$('b').value} ms，下次调整幅度 ±${(step*100).toFixed(1)}%`}

// ---------- 画 ----------
function dot(x,y,r,fill,ring='#000'){
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=fill;ctx.fill();
  ctx.lineWidth=2*devicePixelRatio;ctx.strokeStyle=ring;ctx.stroke();
}
function draw(){
  const W=c.width,Hh=c.height,d=devicePixelRatio;
  ctx.clearRect(0,0,W,Hh);
  const P=p=>{const q=toCss(p);return{x:q.x*d,y:q.y*d}};
  if(corners.length){
    ctx.lineJoin='round';
    ctx.beginPath();
    corners.forEach((p,i)=>{const q=P(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});
    if(corners.length===4)ctx.closePath();
    ctx.lineWidth=5*d;ctx.strokeStyle='#000a';ctx.stroke();
    ctx.lineWidth=2.5*d;ctx.strokeStyle='#33d6ff';ctx.stroke();
    ctx.font=`bold ${13*d}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';
    corners.forEach((p,i)=>{
      const big=mode==='frame';
      const q=P(p);
      dot(q.x,q.y,(big?11:5)*d,'#33d6ff');
      if(big){ctx.fillStyle='#000';ctx.fillText(i+1,q.x,q.y+.5*d)}
    });
  }
  if(line){
    const a=P(line.a),b=P(line.b);
    ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.lineWidth=7*d;ctx.strokeStyle='#000a';ctx.stroke();
    ctx.lineWidth=4*d;ctx.strokeStyle='#ffd83a';ctx.stroke();
    if(projDir){ // 投影后的线（蓝色虚线）：真正拿来算 ms 的长度
      const bp=fromScreen(projDir.b);
      if(bp){
        const B=P(bp);
        ctx.setLineDash([8*d,6*d]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(B.x,B.y);
        ctx.lineWidth=3*d;ctx.strokeStyle='#33d6ff';ctx.stroke();ctx.setLineDash([]);
        dot(B.x,B.y,5*d,'#33d6ff');
      }
    }
    const r=7*d;
    dot(a.x,a.y,r,'#2fd07a','#fff'); dot(b.x,b.y,r,'#ff5a4a','#fff');
    if(units){ // 线中间显示 ms
      const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,t=curMs+' ms';
      ctx.font=`bold ${15*d}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';
      const tw=ctx.measureText(t).width+14*d;
      ctx.fillStyle='#000c';ctx.beginPath();ctx.roundRect?ctx.roundRect(mx-tw/2,my-24*d,tw,22*d,6*d):ctx.rect(mx-tw/2,my-24*d,tw,22*d);ctx.fill();
      ctx.fillStyle='#ffd83a';ctx.fillText(t,mx,my-13*d);
    }
  }
  if(piece&&$('autoStart').checked&&mode==='line'){ // 自动找到的小人位置
    const q=P(piece.pt), okk=piece.score>=thr();
    ctx.lineWidth=2.5*d;ctx.strokeStyle=okk?'#5fe08f':'#ff7b66';
    ctx.beginPath();ctx.arc(q.x,q.y,11*d,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(q.x-16*d,q.y);ctx.lineTo(q.x+16*d,q.y);ctx.moveTo(q.x,q.y-16*d);ctx.lineTo(q.x,q.y+16*d);ctx.stroke();
    ctx.font=`bold ${12*d}px system-ui`;ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle='#000c';ctx.fillRect(q.x+14*d,q.y-22*d,36*d,16*d);
    ctx.fillStyle=okk?'#5fe08f':'#ff7b66';ctx.fillText(piece.score.toFixed(2),q.x+17*d,q.y-14*d);
  }
  if(act) loupe();
}
// 放大镜：显示手指下方的画面，放在手指的另一侧
function loupe(){
  const p=act.kind==='corner'?corners[act.i]:line[act.key];
  if(!p||!v.videoWidth)return;
  const W=c.width,Hh=c.height,d=devicePixelRatio;
  const R=Math.min(62*d,W*0.2), Z=3, m=10*d;
  const q=toCss(p);
  const cx=q.x<view.w/2?W-R-m:R+m, cy=q.y<view.h*0.4&&Hh>4*R?Hh-R-m:R+m;
  const sw=2*R/Z/(view.s*d);
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();
  ctx.fillStyle='#000';ctx.fillRect(cx-R,cy-R,2*R,2*R);
  try{ctx.drawImage(v,p.x*v.videoWidth-sw/2,p.y*v.videoHeight-sw/2,sw,sw,cx-R,cy-R,2*R,2*R)}catch{}
  ctx.strokeStyle='#ff3b3b';ctx.lineWidth=1.5*d;ctx.beginPath();
  ctx.moveTo(cx-R,cy);ctx.lineTo(cx-5*d,cy);ctx.moveTo(cx+5*d,cy);ctx.lineTo(cx+R,cy);
  ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy-5*d);ctx.moveTo(cx,cy+5*d);ctx.lineTo(cx,cy+R);
  ctx.stroke();
  ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.lineWidth=3*d;ctx.strokeStyle='#fff';ctx.stroke();
}

// ---------- 快/慢 校准 ----------
// 「跳太远/跳太近/刚好」作用在「上一次按的东西」：
//   画线按的 → 把上一次的按压时间 ±step，反推新的 k；方向跟上次相反 → step 减半（逐步逼近）。
//   预设按的 → 只调整那个预设自己的 ms（不动 k），每个预设有自己的幅度。
let lastTarget=null;    // {type:'line'} | {type:'preset',id} | {type:'manual'}
let lastPressMs=0;      // 上一次按的 ms（不管怎么按的）
function feedback(dir){
  if(lastTarget&&lastTarget.type==='preset') return presetFeedback(dir);
  if(!lastTarget||lastTarget.type!=='line'||!last.units){st('先用「按！」或预设按一次，再告诉我跳太远还是跳太近','warn');return}
  if(lastDir&&dir!==lastDir) step=Math.max(0.01,step/2);
  lastDir=dir;
  const b=+$('b').value, newMs=last.ms*(1+dir*step);
  const k=Math.max(0.001,(newMs-b)/last.units);
  $('k').value=k.toFixed(4); store.set('k',k); store.set('step',step);
  st(`${dir<0?'缩短':'加长'} ${(step*100).toFixed(1)}%：刚才那条线下次按 ${Math.round(newMs)} ms`,'ok');
  recordResult(dir,newMs);
  calc(); info();
}
$('less').onclick=()=>feedback(-1);
$('more').onclick=()=>feedback(+1);
$('ok').onclick=()=>{
  if(lastTarget&&lastTarget.type==='preset') return presetOk();
  step=Math.max(0.01,step/2);lastDir=0;store.set('step',step);info();
  if(lastTarget&&lastTarget.type==='line'&&last.units){
    recordResult(0,last.ms);
    addPreset(last.ms,last.units,'👍 收窄调整幅度；');   // 跳得刚好 → 自动存成预设
  }else st('👍 收窄调整幅度','ok');
};

// ---------- 预设跳跃 ----------
// 预设 {id, ms, dist(存的时候的距离，可能是 0), step(自己的调整幅度), lastDir}
let presets=store.get('presets',[]), preEdit=false, preOpen=store.get('preOpen',true);
if(!Array.isArray(presets)) presets=[];
function savePresets(){presets.sort((a,b)=>a.ms-b.ms);store.set('presets',presets);renderPresets()}
function addPreset(ms,dist,prefix=''){
  ms=Math.round(ms);
  if(!(ms>0)){st('没有可以存的 ms','warn');return false}
  const near=presets.find(p=>Math.abs(p.ms-ms)<=8);
  if(near){st(`${prefix}已有相近的预设 ${near.ms} ms，不重复存`,'ok');return false}
  presets.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                ms,dist:dist?Math.round(dist):0,step:0.04,lastDir:0});
  if(!preOpen){preOpen=true;store.set('preOpen',true)}
  savePresets(); st(`${prefix}已存成预设 ${ms} ms ✓`,'ok'); return true;
}
function renderPresets(){
  const g=$('pgrid');
  g.hidden=!preOpen; g.classList.toggle('edit',preEdit);
  $('preT').textContent=`${preOpen?'▾':'▸'} 预设跳跃（${presets.length}）`;
  $('preEdit').textContent=preEdit?'完成':'编辑';
  $('preEdit').className=preEdit?'on':'sec';
  $('preEdit').hidden=!presets.length&&!preEdit;
  g.innerHTML='';
  if(!presets.length) g.innerHTML='<div class="pempty">还没有预设。跳得刚好时按「✓ 刚好」会自动存，或按「＋ 存现在」。</div>';
  presets.forEach(p=>{
    const t=document.createElement('div');
    t.className='pt'+(lastTarget&&lastTarget.id===p.id?' cur':'');
    t.innerHTML=`<b>${p.ms}<i>ms</i></b><small>${p.dist?'距离 '+p.dist:'无距离'}${preEdit?' · ±'+(p.step*100).toFixed(1)+'%':''}</small>`;
    if(preEdit){
      const e=document.createElement('div'); e.className='pe';
      [['−5','sec',()=>nudgePreset(p,-5)],['+5','sec',()=>nudgePreset(p,5)],['删除','del',()=>delPreset(p)]].forEach(([l,cls,f])=>{
        const b=document.createElement('button'); b.textContent=l; b.className=cls;
        b.onclick=ev=>{ev.stopPropagation();f()}; e.appendChild(b);
      });
      t.appendChild(e);
    }else t.onclick=()=>pressPreset(p);
    g.appendChild(t);
  });
  fitStage();
}
function nudgePreset(p,d){p.ms=Math.max(1,p.ms+d);savePresets();st(`预设改成 ${p.ms} ms`,'ok')}
function delPreset(p){
  if(!confirm(`删除预设 ${p.ms} ms？`))return;
  presets=presets.filter(x=>x!==p);
  if(lastTarget&&lastTarget.id===p.id) lastTarget=null;
  savePresets(); showMs(); st('已删除预设','ok');
}
async function pressPreset(p){
  if(await press(p.ms)){
    lastTarget={type:'preset',id:p.id}; lastPressMs=p.ms;
    renderPresets(); showMs();
    st(`按预设 ${p.ms} ms… 跳太远/跳太近只会调整这个预设`);
  }
}
function presetFeedback(dir){
  const p=presets.find(x=>x.id===lastTarget.id);
  if(!p){st('那个预设已经删掉了','warn');return}
  if(p.lastDir&&dir!==p.lastDir) p.step=Math.max(0.005,p.step/2);
  p.lastDir=dir;
  const old=p.ms; p.ms=Math.max(1,Math.round(old*(1+dir*p.step)));
  if(p.ms===old) p.ms=Math.max(1,old+dir);
  savePresets();
  st(`预设 ${old} → ${p.ms} ms（${dir<0?'−':'+'}${(p.step*100).toFixed(1)}%）`,'ok');
}
function presetOk(){
  const p=presets.find(x=>x.id===lastTarget.id);
  if(!p){st('那个预设已经删掉了','warn');return}
  p.step=Math.max(0.005,p.step/2); p.lastDir=0; savePresets();
  st(`👍 预设 ${p.ms} ms 的调整幅度收窄为 ±${(p.step*100).toFixed(1)}%`,'ok');
}
$('preT').onclick=()=>{preOpen=!preOpen;store.set('preOpen',preOpen);if(!preOpen)preEdit=false;renderPresets()};
$('preEdit').onclick=()=>{preEdit=!preEdit;if(preEdit&&!preOpen){preOpen=true;store.set('preOpen',true)}renderPresets()};
$('preAdd').onclick=()=>{
  if(units) addPreset(curMs,units);                                     // 有画线：存这条线
  else if(lastPressMs) addPreset(lastPressMs,lastTarget&&lastTarget.type==='line'?last.units:0); // 否则存上一次按的
  else st('先画一条线，或先按一次，才有 ms 可以存','warn');
};

// ---------- 历史记录 → 拟合 k / b ----------
// 每次「画线按压」记一笔；之后按的「跳太远/刚好/跳太近」当作结果：
//   跳太远 → 理想 ms ≈ 实际 ×(1−幅度)，跳太近 → ×(1+幅度)，刚好 → 实际值。
// 有 8 笔以上就用最小二乘法算 理想ms = k × 距离 + b。
let hist=store.get('hist',[]), lastRec=null, fitRes=null;
if(!Array.isArray(hist)) hist=[];
function recordPress(){
  lastRec={d:+units.toFixed(1),raw:+rawUnits.toFixed(1),ms:curMs,proj:projOn(),r:null,est:null,t:Date.now()};
  hist.push(lastRec); if(hist.length>100) hist=hist.slice(-100);
  store.set('hist',hist); showFit();
}
function recordResult(r,est){
  if(!lastRec) return;
  lastRec.r=r; lastRec.est=Math.round(est);
  store.set('hist',hist); showFit();
}
function fitHist(){
  const P=projOn(), rs=hist.filter(h=>h&&h.r!==null&&h.est>0&&h.d>0&&!!h.proj===P);
  const n=rs.length, cnt={'-1':0,'0':0,'1':0}; rs.forEach(h=>cnt[h.r]++);
  if(n<8) return {n,cnt};
  let sx=0,sy=0,sxx=0,sxy=0;
  rs.forEach(h=>{sx+=h.d;sy+=h.est;sxx+=h.d*h.d;sxy+=h.d*h.est});
  const den=n*sxx-sx*sx;
  if(Math.abs(den)<1e-6*n*n) return {n,cnt,bad:true};
  const k=(n*sxy-sx*sy)/den, b=(sy-k*sx)/n;
  const rms=Math.sqrt(rs.reduce((a,h)=>a+(h.d*k+b-h.est)**2,0)/n);
  return {n,cnt,k,b,rms};
}
function showFit(){
  const f=fitHist(), c=f.cnt;
  let t=`共 ${hist.length} 笔（最多留 100）；${projOn()?'投影':'不投影'}模式有结果的 ${f.n} 笔：跳太远 ${c['-1']} / 刚好 ${c['0']} / 跳太近 ${c['1']}`;
  fitRes=null;
  if(f.n<8) t+=`\n再 ${8-f.n} 笔就能拟合。`;
  else if(f.bad||!(f.k>0)) t+='\n距离都太接近，算不出来；多试几种远近。';
  else{ fitRes=f; t+=`\n拟合：k = ${f.k.toFixed(4)}，b = ${Math.round(f.b)} ms（平均误差 ±${Math.round(f.rms)} ms）\n现在：k = ${(+$('k').value).toFixed(4)}，b = ${+$('b').value} ms`; }
  $('fitInfo').textContent=t;
  $('fitApply').classList.toggle('dim',!fitRes);
}
$('fitApply').onclick=()=>{
  if(!fitRes){st('记录还不够（要 8 笔有结果的画线按压）','warn');return}
  const k=+fitRes.k.toFixed(4), b=Math.round(fitRes.b);
  $('k').value=k; $('b').value=b; store.set('k',k); store.set('b',b);
  calc(); info(); showFit(); st(`已套用拟合：k = ${k}，b = ${b} ms`,'ok');
};
$('histClr').onclick=()=>{
  if(!confirm('清除所有历史记录？'))return;
  hist=[]; lastRec=null; store.set('hist',hist); showFit(); st('历史记录已清除','ok');
};

// ---------- 跳跃方向：从最近画线估计角度 ----------
let vecs=store.get('vecs',[]);
if(!Array.isArray(vecs)) vecs=[];
function rememberVec(){
  if(!line||!H) return;
  const a=toScreen(line.a), b=toScreen(line.b);
  let dx=b.x-a.x, dy=b.y-a.y;
  if(Math.hypot(dx,dy)<80) return;
  if(dy>0){dx=-dx;dy=-dy}            // 反着画（从终点拉到起点）也算
  vecs.push({dx:Math.round(dx),dy:Math.round(dy)}); if(vecs.length>20) vecs=vecs.slice(-20);
  store.set('vecs',vecs); angInfo();
}
function vecAngles(){
  const R=[],L=[];
  vecs.forEach(q=>{const a=Math.atan2(-q.dy,Math.abs(q.dx))*180/Math.PI; if(a>=5&&a<=75)(q.dx>0?R:L).push(a)});
  return {R,L};
}
function angInfo(){
  const {R,L}=vecAngles();
  $('angInfo').textContent=`最近的线：右上 ${R.length} 条、左上 ${L.length} 条（每边 3 条以上才能估计）。蓝色虚线 = 投影后真正拿来算的长度。`;
}
$('estAng').onclick=()=>{
  const {R,L}=vecAngles();
  const med=a=>{a=[...a].sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
  const msg=[];
  if(R.length>=3){const a=+med(R).toFixed(1);$('angR').value=a;store.set('angR',a);msg.push(`右上 ${a}°`)}
  if(L.length>=3){const a=+med(L).toFixed(1);$('angL').value=a;store.set('angL',a);msg.push(`左上 ${a}°`)}
  if(!msg.length){st(`线不够：右上 ${R.length}、左上 ${L.length} 条，每边要 3 条`,'warn');return}
  calc(); draw(); st('估计角度：'+msg.join('，'),'ok');
};

// ---------- 自动找起点：模板匹配（纯 JS，缩小的灰阶影像 + NCC） ----------
// 模板在「手机边框外框」缩成宽 120 / 240 的灰阶图上截取，所以跟相机远近无关，只要边框画对。
// 先在 120 宽全区搜索，再到 240 宽在附近 ±4 px 细调。
let tpl=store.get('tpl',null), tplP=null, piece=null;
$('autoStart').checked=store.get('autoStart',false);
$('thr').value=store.get('thr',0.6);
const thr=()=>Math.min(0.95,Math.max(0.3,+$('thr').value||0.6));
$('thr').onchange=()=>{store.set('thr',thr());$('thr').value=thr();draw()};
$('autoStart').onchange=()=>{
  store.set('autoStart',$('autoStart').checked);
  if($('autoStart').checked&&!tplP) st('还没有模板：按「🎯 点小人取模板」','warn');
  piece=null; tip(); draw(); asInfo();
};
const grabCv=document.createElement('canvas'), grabCtx=grabCv.getContext('2d',{willReadFrequently:true});
function frameBox(){
  if(corners.length!==4||!v.videoWidth) return null;
  const xs=corners.map(p=>p.x*v.videoWidth), ys=corners.map(p=>p.y*v.videoHeight);
  const x0=Math.max(0,Math.floor(Math.min(...xs))), y0=Math.max(0,Math.floor(Math.min(...ys)));
  const x1=Math.min(v.videoWidth,Math.ceil(Math.max(...xs))), y1=Math.min(v.videoHeight,Math.ceil(Math.max(...ys)));
  return (x1-x0<20||y1-y0<20)?null:{x0,y0,w:x1-x0,h:y1-y0};
}
function grabGray(W){
  const bx=frameBox(); if(!bx) return null;
  const s=W/bx.w, h=Math.max(8,Math.round(bx.h*s));
  grabCv.width=W; grabCv.height=h;
  grabCtx.drawImage(v,bx.x0,bx.y0,bx.w,bx.h,0,0,W,h);
  const d=grabCtx.getImageData(0,0,W,h).data, g=new Float32Array(W*h);
  for(let i=0,j=0;i<g.length;i++,j+=4) g[i]=0.299*d[j]+0.587*d[j+1]+0.114*d[j+2];
  return {g,w:W,h,bx,s};
}
const toVidN=(G,x,y)=>({x:(G.bx.x0+x/G.s)/v.videoWidth, y:(G.bx.y0+y/G.s)/v.videoHeight});
const fromVidN=(G,p)=>({x:(p.x*v.videoWidth-G.bx.x0)*G.s, y:(p.y*v.videoHeight-G.bx.y0)*G.s});
function cutTpl(G,p){ // 以脚底为基准，往上截一个直立长方形（小人约占屏宽 1/10）
  const tw=Math.max(6,Math.round(G.w*0.10)), th=Math.round(tw*1.7), f=fromVidN(G,p);
  const x0=Math.round(f.x-tw/2), y0=Math.round(f.y-th*0.88);
  if(x0<0||y0<0||x0+tw>G.w||y0+th>G.h) return null;
  const t=[]; for(let y=0;y<th;y++)for(let x=0;x<tw;x++) t.push(Math.round(G.g[(y0+y)*G.w+x0+x]));
  return {t,tw,th,fx:f.x-x0,fy:f.y-y0};
}
function prepT(T){
  const n=T.t.length; let m=0; for(const x of T.t) m+=x; m/=n;
  const tz=new Float32Array(n); let ss=0;
  for(let i=0;i<n;i++){tz[i]=T.t[i]-m; ss+=tz[i]*tz[i]}
  return {tw:T.tw,th:T.th,fx:T.fx,fy:T.fy,tz,ss,n};
}
function prepTpl(){
  tplP=null;
  try{ if(tpl&&tpl[120]&&tpl[240]) tplP={120:prepT(tpl[120]),240:prepT(tpl[240])}; }catch{ tplP=null; }
}
function ncc(G,T,x0,y0){ // 零均值正规化互相关，-1~1
  const w=G.w, g=G.g, tw=T.tw, tz=T.tz; let sg=0,sgg=0,sx=0;
  for(let y=0;y<T.th;y++){
    const r=(y0+y)*w+x0, k=y*tw;
    for(let x=0;x<tw;x++){const val=g[r+x]; sg+=val; sgg+=val*val; sx+=tz[k+x]*val}
  }
  const vg=sgg-sg*sg/T.n;
  return (vg<1e-3||T.ss<1e-3)?-1:sx/Math.sqrt(vg*T.ss);
}
function inPoly(P,x,y){
  let o=false;
  for(let i=0,j=P.length-1;i<P.length;j=i++)
    if((P[i].y>y)!==(P[j].y>y)&&x<(P[j].x-P[i].x)*(y-P[i].y)/(P[j].y-P[i].y)+P[i].x) o=!o;
  return o;
}
function findPiece(){
  if(!tplP||corners.length!==4) return null;
  const G1=grabGray(120); if(!G1) return null;
  const T1=tplP[120], poly=corners.map(p=>fromVidN(G1,p));
  let best=-2,bx=0,by=0;
  for(let y=0;y+T1.th<=G1.h;y++) for(let x=0;x+T1.tw<=G1.w;x++){
    if(!inPoly(poly,x+T1.fx,y+T1.fy)) continue;      // 脚底要在手机边框里面
    const sc=ncc(G1,T1,x,y); if(sc>best){best=sc;bx=x;by=y}
  }
  if(best<-1) return null;
  const G2=grabGray(240), T2=tplP[240];
  const cx=Math.round((bx+T1.fx)*2-T2.fx), cy=Math.round((by+T1.fy)*2-T2.fy);
  let b2=-2,rx=cx,ry=cy;
  for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
    const x=cx+dx,y=cy+dy;
    if(x<0||y<0||x+T2.tw>G2.w||y+T2.th>G2.h) continue;
    const sc=ncc(G2,T2,x,y); if(sc>b2){b2=sc;rx=x;ry=y}
  }
  return b2<-1 ? {pt:toVidN(G1,bx+T1.fx,by+T1.fy),score:best}
               : {pt:toVidN(G2,rx+T2.fx,ry+T2.fy),score:b2};
}
function pickTemplate(p){
  if(!v.videoWidth||corners.length!==4){st('先开相机、画好手机边框','warn');return}
  const out={};
  for(const W of [120,240]){
    const G=grabGray(W), T=G&&cutTpl(G,p);
    if(!T){st('小人太靠边，取不到模板；换个位置再试','warn');return}
    out[W]=T;
  }
  tpl=out; store.set('tpl',tpl); prepTpl(); drawTplPreview();
  if(!$('autoStart').checked){$('autoStart').checked=true;store.set('autoStart',true)}
  piece=findPiece(); draw(); asInfo();
  st(`模板已存 ✓ 自检信心 ${piece?piece.score.toFixed(2):'—'}；之后只要点终点`,'ok');
}
function drawTplPreview(){
  const cv=$('tplV'), x=cv.getContext('2d');
  if(!tpl||!tpl[240]){x.clearRect(0,0,cv.width,cv.height);return}
  const T=tpl[240]; cv.width=T.tw; cv.height=T.th;
  const im=x.createImageData(T.tw,T.th);
  T.t.forEach((g,i)=>{im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=g;im.data[i*4+3]=255});
  x.putImageData(im,0,0);
}
function asInfo(ms){
  let t=tplP?'已有模板。':'还没有模板：先画好手机边框，按「🎯 点小人取模板」，再点小人的脚底中心。';
  if(piece) t+=` 最近一次：信心 ${piece.score.toFixed(2)}（门槛 ${thr()}）${ms?'，耗时 '+Math.round(ms)+' ms':''}。`;
  t+=' 绿色十字 = 找到，红色 = 信心太低（会退回两点画线）。';
  $('asInfo').textContent=t;
}
$('pickT').onclick=()=>{
  if(!v.srcObject){st('先开相机','warn');return}
  if(corners.length!==4){st('先画好手机边框（4 个角）','warn');return}
  setMode('pick'); scrollTo({top:0,behavior:'smooth'});
};
// 待机时每 0.7 秒找一次小人，画面上显示找到的位置（方便确认模板好不好用）
setInterval(()=>{
  if(!$('autoStart').checked||!tplP||mode!=='line'||act||!v.srcObject||document.hidden) return;
  const t0=performance.now(); piece=findPiece(); draw(); asInfo(performance.now()-t0);
},700);
$('resetStep').onclick=()=>{step=0.10;lastDir=0;store.set('step',step);info();st('调整幅度重置为 ±10%','ok')};

// ---------- 蓝牙 ----------
function setConn(on,name){
  $('conn').className=on?'on':''; $('conn').textContent=on?'🔗 已连':'蓝牙'; showMs();
}
$('conn').onclick=async()=>{
  if(!navigator.bluetooth){st('这个浏览器不支持 Web Bluetooth（Android/电脑用 Chrome；iPhone 用 Bluefy）','err');return}
  try{
    st('搜索中…');
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
    dev.addEventListener('gattserverdisconnected',()=>{rx=null;setConn(false);st('蓝牙断开','err')});
    const s=await (await dev.gatt.connect()).getPrimaryService(SVC);
    rx=await s.getCharacteristic(RX);
    const tx=await s.getCharacteristic(TX);
    await tx.startNotifications();
    tx.addEventListener('characteristicvaluechanged',e=>{
      const m=new TextDecoder().decode(e.target.value);
      if(m[0]==='D')st(`已回弹 ✓（${m.slice(1)} ms）结果怎样？点下面按钮`,'ok');
      if(m[0]==='A'){const[r,p]=m.slice(1).split(',');setAng('ra',+r,false);setAng('pa',+p,false);$('angSt').textContent=`板子上的设定：静止 ${r}°，压下 ${p}°`}
    });
    setConn(true); st('已连接 '+dev.name,'ok');
    send('G');
  }catch(e){st('连接失败：'+e.message,'err')}
};
async function send(cmd){
  if(!rx){st('还没连接蓝牙（点右上角「蓝牙」）','warn');return false}
  try{await rx.writeValueWithResponse(new TextEncoder().encode(cmd));return true}
  catch(e){st('发送失败：'+e.message,'err');return false}
}
async function press(ms){
  ms=Math.round(ms); if(!(ms>0)){st('按压时间要大于 0','warn');return false}
  if(await send('P'+ms)){st('按 '+ms+' ms…');return true}
  return false;
}
async function pressLine(){
  if(!units){st(H?'先在画面上画一条线':'先画手机边框，再画距离','warn');return}
  if(await press(curMs)){
    last={ms:curMs,units}; lastTarget={type:'line'}; lastPressMs=curMs;
    recordPress(); renderPresets(); showMs();
  }
}
$('press').onclick=pressLine;
$('go').onclick=async()=>{
  const ms=Math.round(+$('manual').value);
  if(await press(ms)){lastTarget={type:'manual'};lastPressMs=ms;renderPresets();showMs()}
};

// ---------- Servo 角度 ----------
// 拖动时连续发 M<角度>；蓝牙一次只能送一个，忙的时候只留最新值
let liveBusy=false, livePending=null;
async function live(a){
  if(!rx)return;
  if(liveBusy){livePending=a;return}
  liveBusy=true;
  try{await rx.writeValueWithResponse(new TextEncoder().encode('M'+a))}catch(e){}
  liveBusy=false;
  if(livePending!==null){const n=livePending;livePending=null;live(n)}
}
function setAng(id,a,move=true){
  a=Math.max(0,Math.min(180,Math.round(a)||0));
  $(id).value=a; $(id+'S').value=a; store.set(id,a);
  if(move) live(a);
}
setAng('ra',store.get('ra',0),false); setAng('pa',store.get('pa',90),false);
['ra','pa'].forEach(id=>{
  $(id+'S').oninput=()=>setAng(id,+$(id+'S').value);
  $(id).onchange=()=>setAng(id,+$(id).value);
});
document.querySelectorAll('.pm').forEach(b=>b.onclick=()=>setAng(b.dataset.t,+$(b.dataset.t).value+ +b.dataset.d));
$('toRest').onclick=()=>live(+$('ra').value);
$('toPush').onclick=()=>live(+$('pa').value);
$('saveA').onclick=async()=>{
  if(await send(`A${+$('ra').value},${+$('pa').value}`)) st('角度已保存到板子 ✓','ok');
};
$('tryP').onclick=async()=>{
  // 先存再试，确保用的是现在的角度
  if(await send(`A${+$('ra').value},${+$('pa').value}`)) setTimeout(()=>press(300),150);
};

// ---------- 安装到手机 (PWA) ----------
if('serviceWorker'in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(!standalone)$('inst').hidden=false;fitStage()});
addEventListener('appinstalled',()=>{installEvt=null;$('inst').hidden=true;st('已安装到主屏幕 ✓','ok')});
// iPhone 没有安装弹窗，只能教用户手动加
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS&&!standalone) $('inst').hidden=false;
$('inst').onclick=async()=>{
  if(installEvt){
    installEvt.prompt();
    const r=await installEvt.userChoice; installEvt=null;
    if(r.outcome==='accepted') $('inst').hidden=true;
  }else if(isIOS){
    st('iPhone：点 Safari 底部「分享」→「添加到主屏幕」','warn');
  }else{
    st('用浏览器菜单（⋮）→「安装应用 / 添加到主屏幕」','warn');
  }
};

prepTpl(); drawTplPreview(); asInfo(); angInfo(); showFit(); renderPresets();
info(); tip(); showMs(); fitStage();
</script>
</body></html>
